name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Ruff Lint
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format --check .

      - name: Run Mypy (Strict on packages/core)
        run: uv run mypy packages/core

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run Tests with Coverage
        run: uv run --python ${{ matrix.python-version }} pytest --cov=schemawatch --cov-report=term-missing --cov-fail-under=90

  web:
    name: Frontend (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security Audit (Production Dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Type Check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest
        run: npm run test

      - name: Build Web Dashboard
        run: npm run build

  docker-smoke:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Make scripts executable
        run: chmod +x scripts/*.sh

      - name: Run safe environment setup
        run: ./scripts/setup.sh

      - name: Build and start Docker Compose stack
        run: docker compose up --build -d

      - name: Run automated smoke test
        run: ./scripts/smoke-test.sh

      - name: Inspect logs on failure
        if: failure()
        run: docker compose logs --tail 100

      - name: Clean up Docker Compose
        if: always()
        run: docker compose down -v
