[project]
name = "schemawatch-monorepo"
version = "0.1.0"
description = "Monorepo for schemawatch: open-source API contract drift monitor"
requires-python = ">=3.10"
dependencies = [
    "schemawatch",
    "schemawatch-api",
]

[tool.uv.workspace]
members = ["packages/core", "apps/api"]

[tool.uv.sources]
schemawatch = { workspace = true }
schemawatch-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.100.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "apps/api/tests"]
addopts = "-v"
asyncio_mode = "auto"
pythonpath = [".", "apps/api", "packages/core"]
