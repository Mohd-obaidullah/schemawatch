[project]
name = "schemawatch-api"
version = "0.1.0"
description = "FastAPI server and API for schemawatch"
requires-python = ">=3.10"
dependencies = [
    "schemawatch",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
]

[project.scripts]
schemawatch-api = "schemawatch_api.__main__:main"

[tool.uv.sources]
schemawatch = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
