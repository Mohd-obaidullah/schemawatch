[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schemawatch-api"
version = "0.1.0"
description = "FastAPI server and API for schemawatch"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohd Obaidullah" }]
keywords = ["api", "schema", "drift", "fastapi", "monitoring", "contract-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "schemawatch-core>=0.1.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg[binary]>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/Mohd-obaidullah/schemawatch"
Source = "https://github.com/Mohd-obaidullah/schemawatch"
Issues = "https://github.com/Mohd-obaidullah/schemawatch/issues"
Changelog = "https://github.com/Mohd-obaidullah/schemawatch/blob/main/CHANGELOG.md"

[project.scripts]
schemawatch-api = "schemawatch_api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["schemawatch_api"]

[tool.uv.sources]
schemawatch-core = { workspace = true }
